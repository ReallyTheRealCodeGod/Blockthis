<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess But Brainrot</title>
<style>
  :root {
    --bg1: #12002b; --bg2: #3b0a6b; --bg3: #00334d;
    --light: #b69cff; --dark: #5b2bb8;
    --cyan: #19f0ff; --pink: #ff2bd6; --lime: #b6ff1a; --yellow: #ffe600; --red: #ff3b3b;
    --ink: #fff;
    --bs: min(calc(100vw - 84px), 58vh, 520px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3), var(--bg1));
    background-size: 400% 400%;
    animation: bgmove 14s ease-in-out infinite;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
    -webkit-user-select: none; user-select: none;
  }
  @keyframes bgmove { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  #floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  #floaters span { position: absolute; bottom: -60px; font-size: 32px; opacity: .22; animation: rise linear infinite; }
  @keyframes rise { to { transform: translateY(-115vh) rotate(360deg); } }

  #app { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); transition: filter .6s; }
  #app.shake { animation: shake .4s; }
  #app.big-shake { animation: shake .7s; }
  @keyframes shake {
    0%,100% { transform: translate(0,0) rotate(0); }
    15% { transform: translate(-7px,4px) rotate(-.6deg); } 30% { transform: translate(6px,-5px) rotate(.6deg); }
    45% { transform: translate(-5px,-3px) rotate(-.4deg); } 60% { transform: translate(5px,4px) rotate(.4deg); }
    80% { transform: translate(-2px,2px); }
  }
  #app.hue { filter: hue-rotate(140deg) saturate(1.6); }

  /* ticker */
  #ticker { overflow: hidden; white-space: nowrap; background: var(--yellow); color: #111; font-weight: 900;
    font-size: 12px; letter-spacing: .5px; border-radius: 6px; padding: 4px 0; margin-bottom: 8px; }
  #ticker div { display: inline-block; padding-left: 100%; animation: tick 28s linear infinite; }
  @keyframes tick { to { transform: translateX(-100%); } }

  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  h1 { margin: 0; font-family: Impact, "Arial Black", system-ui, sans-serif; font-size: clamp(17px, 5vw, 28px); white-space: nowrap;
    letter-spacing: 1px; text-transform: uppercase; line-height: 1;
    background: linear-gradient(90deg, var(--cyan), var(--pink), var(--yellow), var(--cyan)); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: slide 4s linear infinite; }
  @keyframes slide { to { background-position: 300% 0; } }
  .live { background: var(--red); font-weight: 800; font-size: 12px; padding: 3px 8px; border-radius: 6px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  /* aura */
  #aurawrap { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-weight: 800; font-size: 13px; }
  #aurabar { flex: 1; height: 14px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; border: 1px solid rgba(255,255,255,.25); }
  #aurafill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--lime), var(--yellow), var(--pink)); transition: width .5s; }
  #aurarank { min-width: 112px; text-align: right; color: var(--yellow); }
  #combo { color: var(--lime); min-width: 70px; font-family: Impact, system-ui; font-size: 18px; transition: transform .15s; }
  #combo.bump { transform: scale(1.5) rotate(-6deg); }

  #timewrap { height: 6px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; margin-bottom: 6px; visibility: hidden; }
  #timewrap.on { visibility: visible; }
  #timebar { height: 100%; width: 100%; background: var(--lime); }

  /* stage = board + rail */
  #stage { position: relative; display: flex; gap: 10px; justify-content: center; align-items: flex-start; }
  #boardbox { position: relative; width: var(--bs); height: var(--bs); transition: transform .9s cubic-bezier(.5,1.6,.4,1); }
  #boardbox.spin { transform: rotate(360deg); }
  #board { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    border-radius: 10px; overflow: hidden; border: 3px solid var(--pink); box-shadow: 0 0 24px var(--pink), 0 0 60px rgba(25,240,255,.35); }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; border: 0; font: inherit; color: inherit; }
  .sq.l { background: var(--light); } .sq.d { background: var(--dark); }
  .sq .co { position: absolute; font-size: calc(var(--bs) / 40); font-weight: 800; opacity: .6; pointer-events: none; }
  .sq .co.r { top: 2px; left: 3px; } .sq .co.f { bottom: 1px; right: 3px; }
  .sq.last::before { content: ""; position: absolute; inset: 0; background: rgba(255,230,0,.38); }
  .sq.sel::before { content: ""; position: absolute; inset: 0; background: rgba(182,255,26,.6); }
  .sq.chk::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,59,59,.95), rgba(255,59,59,.15) 75%); animation: blink .8s infinite; }
  .sq.tgt::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: var(--lime); box-shadow: 0 0 10px var(--lime); opacity: .9; }
  .sq.tgt.cap::after { width: 86%; height: 86%; background: transparent; border: 4px solid var(--red); box-shadow: 0 0 10px var(--red); }
  .pc { position: relative; z-index: 2; width: 84%; height: 84%; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--bs) / 8 * .58); line-height: 1; pointer-events: none; }
  .pc.w { background: radial-gradient(circle, rgba(25,240,255,.5), rgba(25,240,255,.08) 70%); box-shadow: 0 0 0 2px var(--cyan), 0 0 12px var(--cyan); }
  .pc.b { background: radial-gradient(circle, rgba(255,43,214,.5), rgba(255,43,214,.08) 70%); box-shadow: 0 0 0 2px var(--pink), 0 0 12px var(--pink); }
  .skin-classic .pc { font-size: calc(var(--bs) / 8 * .66); }
  .skin-classic .pc.w { color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000; }
  .skin-classic .pc.b { color: #111; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }

  /* rail (tiktok-style buttons) */
  #rail { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 56px; }
  .rb { width: 52px; border: 0; background: none; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 10px; font-weight: 800; cursor: pointer; padding: 0; text-shadow: 0 1px 4px #000; }
  .rb b { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); transition: transform .12s; }
  .rb:active b { transform: scale(.82); }
  .rb.on b { background: var(--lime); color: #000; }
  .rb:disabled { opacity: .35; cursor: not-allowed; }
  #heartbtn b { background: rgba(255,43,100,.35); }

  /* popup */
  #pops { position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: visible; }
  .pop { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); width: max-content; max-width: 92vw; text-align: center; line-height: 1.05; font-family: Impact, "Arial Black", system-ui, sans-serif;
    font-size: clamp(28px, 9vw, 54px); text-transform: uppercase; letter-spacing: 1px; -webkit-text-stroke: 3px #000; paint-order: stroke fill;
    text-shadow: 4px 4px 0 #000; }
  .gain { position: absolute; font-weight: 900; font-size: 20px; color: var(--lime); text-shadow: 0 2px 4px #000; z-index: 20; pointer-events: none; }
  .part { position: fixed; z-index: 30; pointer-events: none; font-size: 24px; }

  /* chat */
  #chat { margin-top: 12px; height: 132px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 3px;
    -webkit-mask-image: linear-gradient(transparent, #000 40%); mask-image: linear-gradient(transparent, #000 40%); }
  .msg { background: rgba(0,0,0,.35); border-radius: 12px; padding: 3px 10px; font-size: 13px; width: fit-content; max-width: 100%; animation: msgin .25s ease-out; }
  .msg b { margin-right: 6px; }
  @keyframes msgin { from { transform: translateY(14px); opacity: 0; } }
  #status { text-align: center; margin-top: 8px; font-weight: 800; min-height: 22px; font-size: 15px; }

  /* end overlay */
  #end { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(10,0,25,.82); padding: 20px; }
  #end.on { display: flex; }
  #endcard { text-align: center; max-width: 420px; padding: 24px; border-radius: 18px; border: 3px solid var(--yellow); background: #1a0540; box-shadow: 0 0 40px var(--pink); animation: msgin .4s; }
  #endcard h2 { font-family: Impact, "Arial Black", system-ui, sans-serif; font-size: 44px; margin: 0 0 6px; text-transform: uppercase; color: var(--yellow); line-height: 1.05; }
  #endcard p { margin: 6px 0; font-weight: 700; }
  #endcard button { margin-top: 14px; font-size: 20px; font-weight: 900; padding: 12px 22px; border: 0; border-radius: 99px; cursor: pointer;
    background: linear-gradient(90deg, var(--cyan), var(--lime)); color: #000; }

  .sq, .rb, .tb, .card, #endcard button { touch-action: manipulation; }
  #evalwrap { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 11px; font-weight: 900; white-space: nowrap; }
  #evalbar { position: relative; flex: 1; min-width: 0; height: 18px; border-radius: 99px; overflow: hidden; background: var(--pink); border: 1px solid rgba(255,255,255,.35); }
  #evalfill { position: absolute; inset: 0 auto 0 0; width: 50%; background: var(--cyan); transition: width .6s cubic-bezier(.3,1.4,.5,1); }
  #evaltxt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #fff;
    text-shadow: 0 1px 2px #000, 0 0 4px #000; white-space: nowrap; overflow: hidden; letter-spacing: .3px; }

  #board { touch-action: none; } /* dragging a piece must not scroll the page */
  .sq.hov { box-shadow: inset 0 0 0 4px var(--yellow); }
  .pc.dragging { opacity: .25; }
  .pc.ghost { position: fixed; z-index: 60; pointer-events: none; transform: translate(-50%,-50%) scale(1.2); animation: none; }
  #promo { position: absolute; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center; background: rgba(10,0,25,.72); border-radius: 10px; }
  #promo[hidden] { display: none; }
  #promobox { text-align: center; padding: 12px; }
  #promobox p { margin: 0 0 10px; font-family: Impact, "Arial Black", system-ui, sans-serif; font-size: 22px; color: var(--yellow); text-transform: uppercase; }
  #promoopts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .po { border: 2px solid var(--cyan); background: rgba(25,240,255,.15); color: #fff; border-radius: 12px; padding: 8px 4px 6px; cursor: pointer; font: inherit;
    font-weight: 900; font-size: 10px; line-height: 1.1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 58px; transition: transform .12s; }
  .po i { font-style: normal; font-size: 30px; line-height: 1.1; }
  .po:hover, .po:focus-visible { background: rgba(25,240,255,.35); transform: scale(1.06); outline: none; }
  #promocancel { margin-top: 10px; background: none; border: 0; color: #fff; opacity: .85; font-weight: 800; text-decoration: underline; cursor: pointer; }

  #grave { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 12px; font-weight: 800; min-height: 18px; }
  #grave span { min-width: 0; overflow-wrap: anywhere; }
  #grave b { color: var(--lime); }
  #legend { text-align: center; font-size: 11px; opacity: .75; margin-top: 3px; }
  #offer { position: absolute; inset: 0; z-index: 26; display: flex; align-items: center; justify-content: center; padding: 12px;
    background: rgba(10,0,25,.82); border-radius: 10px; text-align: center; }
  #offer[hidden] { display: none; }
  #offer p { margin: 0 0 12px; font-family: Impact, "Arial Black", system-ui, sans-serif; font-size: 22px; line-height: 1.1; color: var(--yellow); text-transform: uppercase; }
  .offerbtns { display: flex; flex-direction: column; gap: 8px; }
  .offerbtns button { font: inherit; font-weight: 900; font-size: 15px; padding: 10px 16px; border-radius: 99px; border: 2px solid #fff; color: #000; cursor: pointer; }
  #offerno { background: var(--lime); }
  #offeryes { background: var(--light); }
  #npcmood { display: inline-block; }
  #app.ohio #board { animation: ohiotilt 4s ease-in-out infinite; }
  #app.ohio.fire #board { animation: fireglow .7s ease-in-out infinite alternate, ohiotilt 4s ease-in-out infinite; }
  @keyframes ohiotilt { 0%,100% { rotate: -2deg; } 50% { rotate: 2deg; } }
  .dvd { position: fixed; z-index: 45; left: 0; top: 0; pointer-events: none; padding: 8px 14px; border-radius: 50% / 40%; color: #000;
    font: 900 18px/1 Impact, "Arial Black", system-ui, sans-serif; letter-spacing: 1px; }
  .flash { position: fixed; inset: 0; z-index: 55; background: #fff; pointer-events: none; }

  /* unhinged additions */
  .pc { animation: wob 2.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes wob { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) scale(1.04); } }
  #toolbar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
  .tb { border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.12); color: #fff; font-weight: 800; font-size: 12px; padding: 7px 11px; border-radius: 99px; cursor: pointer; }
  .tb.on { background: var(--lime); color: #000; }
  #hand { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; min-height: 66px; }
  .card { width: 108px; border: 2px solid var(--yellow); border-radius: 12px; background: linear-gradient(160deg, #3b0a6b, #12002b); color: #fff; padding: 6px;
    display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; font-weight: 800; font-size: 11px; font-family: inherit; transition: transform .12s; }
  .card i { font-style: normal; font-size: 24px; }
  .card small { font-weight: 600; font-size: 9px; opacity: .85; text-align: center; line-height: 1.1; }
  .card:disabled { opacity: .4; cursor: not-allowed; }
  .card:not(:disabled):hover { transform: translateY(-4px) scale(1.05); }
  .card.fresh { animation: cardin .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes cardin { from { transform: translateY(40px) scale(.4) rotate(40deg); opacity: 0; } }
  .nohand { font-size: 11px; opacity: .75; align-self: center; text-align: center; max-width: 280px; }
  #npcsay { min-height: 20px; text-align: center; font-size: 13px; font-weight: 800; color: var(--yellow); margin-top: 4px; }
  #runnerwrap { margin-top: 12px; position: relative; }
  #runner { width: 100%; height: auto; display: block; border-radius: 10px; border: 2px solid var(--cyan); background: #0a0020; }
  #runnerwrap span { position: absolute; left: 8px; top: 6px; font-size: 10px; font-weight: 800; opacity: .85; }
  #sponsor { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: none; gap: 10px; align-items: center; justify-content: space-between;
    background: var(--yellow); color: #111; font-weight: 900; font-size: 13px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  #sponsor.on { display: flex; animation: msgin .3s; }
  #sponsor button { border: 2px solid #111; background: #fff; font-weight: 900; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  #sponsor button:disabled { opacity: .55; cursor: default; }
  #app.fire #board { animation: fireglow .7s ease-in-out infinite alternate; }
  @keyframes fireglow { from { box-shadow: 0 0 18px #ff8a1a, 0 0 50px rgba(255,59,59,.5); } to { box-shadow: 0 0 34px #ffe600, 0 0 90px rgba(255,138,26,.7); } }
  #app.ultra #boardbox::before { content: ""; position: absolute; inset: -8px; border-radius: 16px; z-index: -1; filter: blur(10px);
    background: conic-gradient(var(--cyan), var(--pink), var(--yellow), var(--lime), var(--cyan)); animation: spinr 4s linear infinite; }
  @keyframes spinr { to { transform: rotate(360deg); } }
  .yeet { position: fixed; z-index: 35; pointer-events: none; font-size: 54px; line-height: 1; }

  @media (prefers-reduced-motion: reduce) {
    .pc, #app.fire #board, #app.ultra #boardbox::before { animation: none; }
    #app.ohio #board, #app.ohio.fire #board { animation: none; }
    body, h1, #ticker div, #floaters span { animation: none; }
    #app.shake, #app.big-shake { animation: none; }
    #boardbox { transition: none; }
    #app.hue { filter: none; }
  }
</style>
</head>
<body>
<div id="floaters" aria-hidden="true"></div>

<div id="app">
  <div id="ticker"><div id="tickertxt"></div></div>

  <header>
    <h1>Chess but Brainrot 💀</h1>
    <div class="live"><i></i>LIVE <span id="viewers">1.2K</span></div>
  </header>

  <div id="aurawrap">
    <span>AURA <span id="aura">0</span></span>
    <div id="aurabar"><div id="aurafill"></div></div>
    <span id="aurarank">NPC</span>
    <span id="combo"></span>
  </div>
  <div id="timewrap"><div id="timebar"></div></div>
  <div id="evalwrap" title="Who is winning, according to the engine">
    <span>🩵 YOU</span>
    <div id="evalbar"><div id="evalfill"></div><div id="evaltxt"></div></div>
    <span id="npcmood">NPC 🤖</span>
  </div>

  <div id="stage">
    <div id="boardbox"><div id="board" role="grid" aria-label="Chess board"></div>
      <div id="promo" hidden role="dialog" aria-label="Choose a promotion piece"><div id="promobox"><p>GLOW UP INTO…</p><div id="promoopts"></div><button type="button" id="promocancel">nvm</button></div></div>
      <div id="offer" hidden role="dialog" aria-label="The bot is offering a draw"><div><p>🤖 NPC: pls can we draw 🥺👉👈</p><div class="offerbtns"><button type="button" id="offerno">❌ DECLINE (based)</button><button type="button" id="offeryes">🤝 ACCEPT (cringe)</button></div></div></div>
    </div>
    <div id="rail">
      <button class="rb" id="heartbtn" aria-label="Like"><b>❤️</b><span id="likes">0</span></button>
      <button class="rb" id="unobtn" aria-label="Uno reverse: undo your last turn (once per game)"><b>🔄</b><span>UNO</span></button>
      <button class="rb" id="adhdbtn" aria-label="Attention span timer"><b>⏱️</b><span>ADHD</span></button>
      <button class="rb" id="lvlbtn" aria-label="Opponent difficulty"><b>🤖</b><span id="lvltxt">SIGMA</span></button>
      <button class="rb" id="ohiobtn" aria-label="Ohio mode: maximum chaos"><b>🌽</b><span>OHIO</span></button>
    </div>
    <div id="pops"></div>
  </div>

  <div id="grave"></div>
  <div id="legend"></div>
  <div id="hand" aria-label="Brainrot cards"></div>
  <div id="toolbar">
    <button class="tb" id="skinbtn">🎨 SKIN</button>
    <button class="tb on" id="mutebtn">🔊 SFX</button>
    <button class="tb on" id="voicebtn">🗣️ VOICE</button>
    <button class="tb" id="beatbtn">🎵 BEAT</button>
    <button class="tb" id="newbtn">♻️ NEW</button>
  </div>
  <div id="status"></div>
  <div id="npcsay"></div>
  <div id="chat" aria-live="off"></div>
  <div id="runnerwrap"><canvas id="runner" width="480" height="110" aria-hidden="true"></canvas><span>SPLIT-SCREEN GAMEPLAY (FOR YOUR ATTENTION SPAN)</span></div>
</div>
<div id="sponsor"></div>

<div id="end"><div id="endcard">
  <h2 id="endtitle"></h2>
  <p id="endsub"></p>
  <p id="endscore"></p>
  <button id="again">RUN IT BACK 🔁</button>
</div></div>

<script src="engine.js"></script>
<script>
(() => {
  'use strict';
  const E = window.ChessEngine;
  const $ = (id) => document.getElementById(id);
  const rand = (a) => a[Math.floor(Math.random() * a.length)];
  const PLAYER = 'w';
  const ADHD_MS = 10000;
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- content ---------- */
  const SKINS = {
    italian: { name: 'ITALIAN BRAINROT', p: '🪵', n: '🐒', b: '☕', r: '🐊', q: '🩰', k: '🦈' },
    meme:    { name: 'MEME',    p: '🗿', n: '🐴', b: '🧙', r: '🏰', q: '💅', k: '👑' },
    animals: { name: 'ANIMALS', p: '🐜', n: '🦄', b: '🦉', r: '🐘', q: '🐝', k: '🦁' },
    food:    { name: 'FOOD',    p: '🍟', n: '🌭', b: '🥖', r: '🍔', q: '🍕', k: '🍩' },
    classic: { name: 'CLASSIC', p: '♟', n: '♞', b: '♝', r: '♜', q: '♛', k: '♚' },
  };
  const SKIN_ORDER = ['italian', 'meme', 'animals', 'food', 'classic'];

    freshCard = -1;
  }
  function grantCard() {
    if (hand.length >= 3) return;
    hand.push(rand(Object.keys(CARDS))); freshCard = hand.length - 1;
    popup('NEW CARD 🃏', '#ffe600'); sfx.promo(); speak('New card'); renderHand();
  }
  function refuse(msg) { setStatus(msg); sfx.lost(); }
  function useCard(i) {
    if (!canUseCard()) return;
    A(); const kind = hand[i];
    const b = S.b.slice(), cast = Object.assign({}, S.cast);
    const clearCorner = (sq) => { if (sq === 63) cast.K = false; if (sq === 56) cast.Q = false; if (sq === 7) cast.k = false; if (sq === 0) cast.q = false; };
    const idxs = (fn) => b.map((p, k) => (p && fn(p) ? k : -1)).filter((k) => k >= 0);
    let m;
    const prevHand = hand.slice();
    if (kind === 'brain') {
      hand.splice(i, 1); popup('BIG BRAIN TIME 🧠', '#ff2bd6'); speak('Big brain time'); sfx.combo(5);
      thinking = true; render(); setStatus('BIG BRAIN IS COOKING 🧠');
      const g = gen;
      think('bestMove', S, 2, seenMap()).then((bm) => {
        aiTimer = setTimeout(() => { if (g !== gen) return; thinking = false; if (bm) play(bm, 'brain', prevHand); else render(); }, 300);
      });
      return;
    }
    if (kind === 'skip') {
      hand.splice(i, 1); skipArmed = true; handKey = '';
      popup('SKIP ARMED ⏭️', '#19f0ff'); speak('Skip armed'); sfx.combo(3); render();
      setStatus('MAKE YOUR MOVE. THE BOT IS GETTING SKIPPED ⏭️');
      return;
    }
    // Cards edit the board directly, so every candidate is checked: the result must not leave
    // your king attacked with the bot to move (impossible in real chess, and the bot could then
    // "capture" your king).
    const safe = (nb) => { const k = nb.indexOf('K'); return k >= 0 && !E.isAttacked(nb, k, 'b'); };
    if (kind === 'flush') {
      const t = shuffle(idxs((p) => E.colorOf(p) === 'b' && p !== 'k')).find((q) => { const nb = b.slice(); nb[q] = null; return safe(nb); });
      if (t === undefined) return refuse('NOTHING SAFE TO FLUSH');
      const cap = b[t]; b[t] = null; clearCorner(t);
      m = { f: t, t, piece: 'x', cap, promo: null, castle: null }; popup('FLUSHED 🚽', '#19f0ff'); speak('Flushed');
    } else if (kind === 'glow') {
      const c = idxs((p) => p === 'P'); if (!c.length) return refuse('NO PAWNS TO GLOW UP');
      const t = rand(c); b[t] = 'Q'; m = { f: t, t, piece: 'P', cap: null, promo: 'q', castle: null };
    } else if (kind === 'clown') {
      const c = idxs((p) => 'qrb'.includes(p)).sort((x, y) => E.VAL[b[y]] - E.VAL[b[x]]);
      const t = c.find((q) => { const nb = b.slice(); nb[q] = 'n'; return safe(nb); });
      if (t === undefined) return refuse('NOTHING TO CLOWN ON');
      b[t] = 'n'; clearCorner(t); m = { f: t, t, piece: 'x', cap: null, promo: null, castle: null };
      popup('CLOWNED 🤡', '#ff8a1a'); speak('Clowned'); burstAtSquare(t, ['🤡', '🎈', '🤣'], 16);
    } else if (kind === 'rizz') {
      // A converted piece keeps its square, so it can't open a line onto your king. Prefer one
      // the bot can't immediately take back (a stolen pawn on rank 7 is usually surrounded).
      const c = idxs((p) => 'pnb'.includes(p)); if (!c.length) return refuse('NOBODY LEFT TO RIZZ');
      const keep = c.filter((q) => { const nb = b.slice(); nb[q] = nb[q].toUpperCase(); return !E.isAttacked(nb, q, 'b'); });
      const t = rand(keep.length ? keep : c); b[t] = b[t].toUpperCase(); m = { f: t, t, piece: 'x', cap: null, promo: null, castle: null };
      popup('RIZZED 😏 +1 PIECE', '#ff2bd6'); speak('Rizzed'); burstAtSquare(t, ['😏', '💘', '✨'], 16);
      setTimeout(() => npcSay('bro left me for you 💔'), 300);
    } else { // nuke
      // Atomic-chess blast: the target and every non-pawn piece next to it, either colour, are
      // removed (kings survive). Picks a blast that costs the bot more than you when one exists.
      const blast = (c) => {
        const out = [c], r0 = c >> 3, f0 = c & 7;
        for (let dr = -1; dr <= 1; dr++) for (let df = -1; df <= 1; df++) {
          const r = r0 + dr, f = f0 + df;
          if ((dr || df) && r >= 0 && r < 8 && f >= 0 && f < 8) { const q = b[r * 8 + f]; if (q && !'pPkK'.includes(q)) out.push(r * 8 + f); }
        }
        return out;
      };
      const ok = [];
      for (const c of idxs((p) => E.colorOf(p) === 'b' && p !== 'k')) {
        const sqs = blast(c), nb = b.slice(); sqs.forEach((q) => { nb[q] = null; });
        if (!safe(nb)) continue;
        ok.push({ c, sqs, net: sqs.reduce((n, q) => n + (E.colorOf(b[q]) === 'b' ? 1 : -1) * E.VAL[b[q].toLowerCase()], 0) });
      }
      if (!ok.length) return refuse('NOWHERE SAFE TO NUKE');
      const good = ok.filter((o) => o.net > 0), pick = good.length ? rand(good) : ok.sort((x, y) => y.net - x.net)[0];
      const cap = b[pick.c];
      for (const q of pick.sqs) { if (q !== pick.c) yeet(q, b[q]); burstAtSquare(q, ['💥', '☢️', '🔥'], 8); b[q] = null; clearCorner(q); }
      m = { f: pick.c, t: pick.c, piece: 'x', cap, promo: null, castle: null };
      popup('NUKED ☢️💣', '#ffe600'); speak('Nuke'); flash(); sfx.boom(); setTimeout(sfx.boom, 180);
      addChat('obituary_bot', `☢️ ${pick.sqs.length} piece${pick.sqs.length > 1 ? 's' : ''} vaporized`, '#ffffff');
    }
    m.card = kind; hand.splice(i, 1); sfx.uno(); shake(true);
    commit({ b, turn: 'b', cast, ep: -1, half: 0 }, m, 'you', prevHand);
  }

  /* ---------- sponsor break ---------- */
  function showSponsor() {
    const el = $('sponsor'); clearInterval(sponsorT);
    let n = 4; el.innerHTML = '<span></span><button type="button" id="skipad" disabled></button>';
    el.firstChild.textContent = rand(SPONSORS);
    const btn = $('skipad'); btn.textContent = 'SKIP IN ' + n; btn.addEventListener('click', () => { if (!btn.disabled) { el.classList.remove('on'); clearInterval(sponsorT); } });
    el.classList.add('on'); let life = 0;
    sponsorT = setInterval(() => {
      life++; n--;
      if (n > 0) btn.textContent = 'SKIP IN ' + n; else { btn.disabled = false; btn.textContent = 'SKIP ▶'; }
      if (life >= 9) { el.classList.remove('on'); clearInterval(sponsorT); }
    }, 1000);
  }

  /* ---------- beat ---------- */
  let beatTimer = null, beatStep = 0, beatNext = 0;
  const BASS = [55, 0, 55, 0, 65.4, 0, 49, 0, 55, 0, 55, 55, 73.4, 0, 65.4, 0];
  const bpm = () => 104 + rankIdx * 14 + Math.min(combo, 5) * 4 + (ohio ? 24 : 0);
  function schedBeat() {
    const a = A(); if (!a) return;
    while (beatNext < a.currentTime + 0.15) {
      const d = beatNext - a.currentTime, st = beatStep;
      if (!muted) {
        if (st % 4 === 0) tone(150, 0.16, 'sine', 0.22, 40, d);
        if (st % 2 === 1) noise(0.03, 0.05, d);
        if (BASS[st]) tone(BASS[st] * 2, 0.13, 'square', 0.05, null, d);
        if (st % 4 === 2) tone(PENTA[(st * 3 + rankIdx) % 6] / 2, 0.1, 'triangle', 0.04, null, d);
      }
      beatNext += 60 / bpm() / 4; beatStep = (beatStep + 1) % 16;
    }
  }
  function setBeat(on) {
    beatOn = on; $('beatbtn').classList.toggle('on', on); clearInterval(beatTimer);
    if (on) { const a = A(); if (!a) { beatOn = false; $('beatbtn').classList.remove('on'); return; } beatStep = 0; beatNext = a.currentTime + 0.1; beatTimer = setInterval(schedBeat, 40); }
  }

  /* ---------- split-screen runner ---------- */
  function startRunner() {
    const cv = $('runner'), g = cv.getContext('2d'), W = cv.width, H = cv.height, GY = H - 20, px = 70;
    let y = 0, vy = 0, coins = 0, bgx = 0, spawn = 40, obs = [], cs = [];
    g.textBaseline = 'alphabetic'; g.textAlign = 'center';
    function draw() {
      const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#1a0540'); sky.addColorStop(1, '#4b1a8f');
      g.fillStyle = sky; g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(255,255,255,.08)'; for (let i = -1; i < W / 80 + 1; i++) g.fillRect(i * 80 + bgx, 20, 40, 6);
      g.fillStyle = '#0d0230'; g.fillRect(0, GY, W, H - GY);
      g.fillStyle = '#19f0ff'; g.fillRect(0, GY, W, 3);
      g.font = '34px serif';
      for (const o of obs) g.fillText(o.e, o.x, GY + 2);
      for (const c of cs) g.fillText('🪙', c.x, c.y);
      g.fillText('🏃', px, GY - y + 2);
      g.font = '800 14px system-ui, sans-serif'; g.textAlign = 'right'; g.fillStyle = '#ffe600'; g.fillText('🪙 ' + coins, W - 10, 20); g.textAlign = 'center';
    }
    function frame() {
      if (!document.hidden) {
        const sp = 4 + Math.min(4, (aura || 0) / 700);
        bgx = (bgx - sp * 0.4) % 80;
        if (--spawn <= 0) {
          const o = { x: W + 20, e: rand(['🚧', '🚽', '🗿', '🚂', '🌵']) }; obs.push(o);
          if (Math.random() < 0.6) for (let k = 0; k < 3; k++) cs.push({ x: o.x - 30 + k * 30, y: GY - 62 });
          spawn = 55 + Math.random() * 70;
        }
        for (const o of obs) o.x -= sp; for (const c of cs) c.x -= sp;
        obs = obs.filter((o) => o.x > -40);
        cs = cs.filter((c) => { if (Math.abs(c.x - px) < 18 && y > 20) { coins++; return false; } return c.x > -20; });
        if (y === 0 && obs.some((o) => o.x - px > 0 && o.x - px < sp * 10)) vy = 8.5;
        y += vy; vy -= 0.65; if (y <= 0) { y = 0; vy = 0; }
        draw();
      }
      requestAnimationFrame(frame);
    }
    if (reduceMotion) draw(); else requestAnimationFrame(frame);
  }

  /* ---------- cursor trail ---------- */
  let lastTrail = 0;
  function trail(e) {
    if (reduceMotion) return;
    const n = performance.now(); if (n - lastTrail < 70) return; lastTrail = n;
    const el = document.createElement('div'); el.className = 'part'; el.textContent = rand(['✨', '💀', '🔥', '🗿', '👁️']);
    el.style.left = e.clientX + 'px'; el.style.top = e.clientY + 'px'; el.style.fontSize = '16px'; document.body.appendChild(el);
    el.animate([{ transform: 'translate(-50%,-50%) scale(1)', opacity: .9 }, { transform: 'translate(-50%,-120%) scale(.3) rotate(90deg)', opacity: 0 }], { duration: 600 }).onfinish = () => el.remove();
  }

  function chaosMaybe() {
    if (over || plyCount % (ohio ? 4 : 10) !== 0) return;
    const roll = rand(['spin', 'hue', 'skin', 'hype', 'rain', 'tax', 'blessing', 'dvd', 'gravity']);
    const app = $('app');
    if (roll === 'spin' && !reduceMotion) {
      popup('BOARD SPIN 🌀', '#19f0ff'); const bb = $('boardbox'); bb.classList.add('spin');
      setTimeout(() => { bb.style.transition = 'none'; bb.classList.remove('spin'); void bb.offsetWidth; bb.style.transition = ''; }, 1000);
    } else if (roll === 'hue' && !reduceMotion) {
      popup('VIBE SHIFT 🌈', '#b6ff1a'); app.classList.add('hue'); setTimeout(() => app.classList.remove('hue'), 4000);
    } else if (roll === 'skin') {
      popup('EMOJI ROULETTE 🎰', '#ffe600');
      skinOverride = rand(['italian', 'meme', 'animals', 'food'].filter((s) => s !== skin));
      render(); setTimeout(() => { skinOverride = null; render(); }, 6000);
    } else if (roll === 'rain') {
      popup('EMOJI RAIN 🌧️', '#19f0ff'); rain(40); chatSay('idle', 3);
    } else if (roll === 'tax') {
      const t = Math.min(aura, 30 + Math.round(aura * 0.1)); setAura(aura - t); const tx = rand(TEXT.tax); popup(tx, '#ff8a1a'); speak(tx); addChat('fanum', 'i am taxing ' + t + ' aura', '#ff8a1a'); burst(innerWidth / 2, innerHeight / 3, ['🍟'], 14);
    } else if (roll === 'blessing') {
      setAura(aura + 150); popup('AURA BLESSING +150 ✨', '#b6ff1a'); speak('Aura blessing'); burst(innerWidth / 2, innerHeight / 3, ['✨', '🙏', '😇'], 18);
    } else if (roll === 'dvd') {
      popup('DVD LOGO EVENT 📀', '#19f0ff'); dvd();
    } else if (roll === 'gravity') {
      popup('GRAVITY GLITCH 🍎', '#b6ff1a'); gravity();
    } else {
      popup('CHAT GOING WILD 📈', '#ff2bd6'); chatSay('idle', 4); addLikes(150);
    }
    sfx.combo(4);
  }

  function finish(st, mover) {
    over = true; clearInterval(timerId); $('timewrap').classList.remove('on'); render();
    let title, sub;
    if (st === 'checkmate') {
      if (mover === PLAYER) {
        title = rand(TEXT.win); sub = 'CHECKMATE. THE BOT IS HAVING A BAD DAY.'; setAura(aura + 1000);
        sfx.horn(); shake(true); buzz(200); chatSay('mate', 6); addLikes(1000);
        for (let i = 0; i < 5; i++) setTimeout(() => burst(innerWidth * Math.random(), innerHeight * (0.2 + Math.random() * 0.4), ['🎉', '👑', '🐐', '🔥', '💯'], 14), i * 250);
        popup('CHECKMATE!!!', '#ffe600'); rain(60); speak('Checkmate! Skibidi!');
      } else {
        title = rand(TEXT.lose); sub = 'CHECKMATE. THE BOT HAS MORE AURA THAN YOU.'; sfx.sad(); chatSay('lose', 4); popup('YOU GOT COOKED 💀', '#ff3b3b');
      }
    } else {
      title = 'DRAW?? 😐';
      sub = ({ stalemate: 'STALEMATE. NOBODY ATE. BORING.', repetition: 'SAME POSITION 3 TIMES. THE LOOP IS REAL.',
        fifty: '50 MOVES WITH NO CAPTURE OR PAWN MOVE. TOUCH GRASS.',
        agreed: 'YOU TOOK THE DRAW WHILE WINNING. THE BOT SAYS THANK YOU. CRINGE.' })[st] || 'NOT ENOUGH PIECES. THE LORE ENDS HERE.';
      sfx.sad(); chatSay('lose', 2);
    }
    setStatus(title);
    endTimer = setTimeout(() => {
      $('endtitle').textContent = title; $('endsub').textContent = sub;
      $('endscore').textContent = `AURA: ${aura} (${rankFor(aura)}) · BEST: ${bestAura}`;
      $('end').classList.add('on');
    }, 1700);
  }

  /* ---------- attention-span timer ---------- */
  function startTurnTimer() {
    clearInterval(timerId);
    const wrap = $('timewrap'), bar = $('timebar');
    if (!adhd || over || S.turn !== PLAYER) { wrap.classList.remove('on'); return; }
    wrap.classList.add('on');
    const end = Date.now() + ADHD_MS;
    timerId = setInterval(() => {
      const left = end - Date.now(), pct = Math.max(0, left / ADHD_MS);
      bar.style.width = (pct * 100) + '%'; bar.style.background = pct < 0.3 ? '#ff3b3b' : pct < 0.6 ? '#ffe600' : '#b6ff1a';
      if (left <= 0) {
        clearInterval(timerId);
        if (over || thinking || S.turn !== PLAYER) return;
        closePromo(); cancelDrag(); closeOffer();
        const ms = legal.filter((m) => !m.promo || m.promo === 'q');
        popup(rand(TEXT.slow), '#ff3b3b'); chatSay('lost', 2); setAura(aura - 15);
        if (ms.length) play(rand(ms), 'timeout');
      }
    }, 100);
  }

  /* ---------- buttons ---------- */
  $('heartbtn').addEventListener('click', (e) => {
    A(); addLikes(1 + Math.floor(Math.random() * 4));
    const r = e.currentTarget.getBoundingClientRect(); heartBurst(r.left + r.width / 2, r.top + r.height / 2, 5);
    tone(900 + Math.random() * 300, 0.07, 'triangle', 0.08);
  });
  $('unobtn').addEventListener('click', () => {
    if ($('unobtn').disabled) return;
    gen++; // drop any engine results for the moves being undone
    const h = history[history.length - 2]; history.length -= 2;
    S = h.S; lastMove = h.lastMove; setAura(h.aura - 20); setCombo(h.combo); selected = -1; legal = E.legalMoves(S); unoLeft = false;
    plyCount = h.plyCount; hand = h.hand.slice(); handKey = '';
    sfx.uno(); popup(rand(TEXT.uno), '#ff2bd6'); shake(false); chatSay('idle', 2);
    render(); refreshEval(); setStatus('TIME LOOP USED. NO MORE UNO THIS GAME.'); startTurnTimer();
  });
  $('adhdbtn').addEventListener('click', (e) => {
    A(); adhd = !adhd; e.currentTarget.classList.toggle('on', adhd);
    setStatus(adhd ? 'ADHD MODE: 10s PER MOVE OR WE PLAY FOR YOU 💀' : 'ADHD MODE OFF. TOUCH GRASS.');
    startTurnTimer();
  });
  $('lvlbtn').addEventListener('click', () => { A(); level = (level + 1) % 3; $('lvltxt').textContent = LEVELS[level]; setStatus('OPPONENT: ' + LEVELS[level]); tone(500 + level * 200, .1, 'square', .05); });
  $('skinbtn').addEventListener('click', () => {
    A(); skin = SKIN_ORDER[(SKIN_ORDER.indexOf(skin) + 1) % SKIN_ORDER.length]; skinOverride = null;
    try { localStorage.setItem('brainrot-chess-skin-v2', skin); } catch (e) {}
    render(); setStatus('SKIN: ' + SKINS[skin].name); tone(700, .08, 'triangle', .07);
  });
  $('mutebtn').addEventListener('click', (e) => { muted = !muted; e.currentTarget.textContent = muted ? '🔇 SFX' : '🔊 SFX'; e.currentTarget.classList.toggle('on', !muted); if (!muted) { A(); tone(800, .1, 'triangle', .08); } else { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (x) {} } });
  $('voicebtn').addEventListener('click', (e) => { A(); voiceOn = !voiceOn; e.currentTarget.classList.toggle('on', voiceOn); if (voiceOn) speak('Voice on, no cap'); else { try { speechSynthesis.cancel(); } catch (x) {} } });
  $('beatbtn').addEventListener('click', () => { A(); setBeat(!beatOn); setStatus(beatOn ? 'BEAT ON: TEMPO SCALES WITH YOUR AURA 🎵' : 'BEAT OFF'); });
  $('newbtn').addEventListener('click', () => { A(); newGame(); });
  $('ohiobtn').addEventListener('click', (e) => {
    A(); ohio = !ohio; e.currentTarget.classList.toggle('on', ohio); $('app').classList.toggle('ohio', ohio);
    if (ohio) { popup('OHIO MODE 🌽', '#ffe600'); speak('Ohio mode activated'); rain(30); setStatus('OHIO MODE: CHAOS AND CARDS EVERY 4 PLIES 🌽'); }
    else setStatus('OHIO MODE OFF. YOU ESCAPED OHIO.');
  });
  $('offeryes').addEventListener('click', () => {
    closeOffer(); showEval({ st: 'agreed', cp: 0, mate: 0 }); npcSay('W. thank you. you are so kind 🥹'); finish('agreed', PLAYER);
  });
  $('offerno').addEventListener('click', () => {
    closeOffer(); setAura(aura + 100); popup('DECLINED. BASED 🗿', '#b6ff1a'); npcSay(rand(NPC.rage)); chatSay('capture', 2); render();
  });
  $('again').addEventListener('click', () => { A(); newGame(); });

  /* ---------- ambient brainrot ---------- */
  function init() {
    const fl = $('floaters'), icons = ['💀', '🗿', '😭', '🔥', '👁️', '🚽', '🐐', '💅', '🧠', '🍟', '😳', '✨'];
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span'); s.textContent = icons[i % icons.length];
      s.style.left = (Math.random() * 100) + '%'; s.style.animationDuration = (12 + Math.random() * 16) + 's'; s.style.animationDelay = (-Math.random() * 20) + 's';
      s.style.fontSize = (22 + Math.random() * 30) + 'px'; fl.appendChild(s);
    }
    $('tickertxt').textContent = TICKER.join('   ✦   ') + '   ✦   ';
    let viewers = 1200 + Math.floor(Math.random() * 600);
    setInterval(() => { viewers = Math.max(300, viewers + Math.floor((Math.random() - 0.42) * 90)); $('viewers').textContent = fmt(viewers); }, 1800);
    setInterval(() => { if (!over) addChat(rand(USERS), rand(CHAT.idle)); }, 4500);
    $('lvltxt').textContent = LEVELS[level];
    addEventListener('pointermove', trail);
    startRunner();
    newGame();
  }
  init();
})();
